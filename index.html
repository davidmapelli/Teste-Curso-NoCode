<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste-git</title>
<style>
  :root {
    --bg: #0d0f12;
    --bg-elevated: #15181d;
    --text: #e8e9ec;
    --text-muted: #9aa0a8;
    --accent: #5eead4;
    --border: #23272e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }

  main {
    max-width: 560px;
    width: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px 40px;
    text-align: center;
  }

  .badge {
    display: inline-block;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 4px 14px;
    margin-bottom: 24px;
  }

  h1 {
    font-size: 32px;
    margin: 0 0 12px;
    font-weight: 600;
  }

  p {
    color: var(--text-muted);
    line-height: 1.6;
    font-size: 16px;
    margin: 0 0 8px;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 28px 0;
  }

  footer {
    font-size: 13px;
    color: var(--text-muted);
  }

  code {
    background: #1c2026;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 8px;
    color: var(--accent);
    font-size: 13px;
  }
</style>
</head>
<body>
  <main>
    <span class="badge">Teste-git</span>
    <h1>Bem-vindo 👋</h1>
    <p>Este repositório é um espaço de testes e aprendizado de Git e GitHub.</p>
    <p>Sinta-se à vontade para explorar, experimentar e errar por aqui.</p>
    <div class="divider"></div>
    <footer>Criado em <code>index.html</code> — sem dependências externas.</footer>
  </main>
</body>
</html>
